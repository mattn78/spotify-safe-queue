<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe Queue Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: desktop = scenario notes beside a phone frame; phone = the app fills the screen with notes below */
:root{
  --ink:#212121; --panel:#212121; --row:#2a2a2a; --row-hi:#333333; --line:#363636;
  --txt:#ffffff; --mute:#b3b3b3; --dim:#7c7c7c;
  --accent:#1ed760; --accent-ink:#000000; --warn:#ffcf5c;
  --page:#000000; --page-txt:#ffffff; --page-mute:#b3b3b3; --card:#181818;
  --f-ui:"Figtree","Helvetica Neue", Helvetica, Arial, sans-serif;
  --np1:#3a2a4a; --f-mono:var(--f-ui); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-txt);font-family:var(--f-ui);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:900px;margin:0 auto;display:grid;grid-template-columns:390px minmax(0,1fr);gap:48px;align-items:start;justify-content:center}
.notes{min-width:0;padding-top:12px}
.notes h1{font-size:24px;line-height:1.2;margin:0 0 6px;font-weight:700;text-wrap:balance}
.notes .sub{color:var(--page-mute);margin:0 0 22px;font-size:15px;max-width:60ch}
.notes p{font-size:16px;line-height:1.5;margin:0 0 10px;max-width:60ch}
.notes ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:16px;line-height:1.45;max-width:60ch;color:var(--page-mute)}
.notes ol b{color:var(--page-txt)}
.notes .scen{background:var(--card);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.5;max-width:62ch}
.restart{margin-top:20px;font:700 14px var(--f-ui);background:transparent;color:var(--page-txt);border:1px solid #7c7c7c;border-radius:999px;padding:8px 18px;cursor:pointer}
.restart:focus-visible,.app button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{font-size:12px;color:var(--page-mute);margin-top:18px;max-width:62ch}

/* phone */
.phone{width:100%;max-width:390px;min-width:0;height:780px;max-height:calc(100vh - 48px);min-height:620px;background:var(--ink);color:var(--txt);
  border-radius:38px;border:10px solid #2a2a2a;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-self:start}
.app{display:flex;flex-direction:column;height:100%;position:relative}
.app button{font-family:var(--f-ui);color:inherit}
.top{padding:8px 18px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.grabbar{display:block;width:60px;height:14px;border:0;background:linear-gradient(var(--line),var(--line)) center/40px 4px no-repeat;margin:0 auto 6px;cursor:pointer;border-radius:4px}
.toptitle{display:flex;align-items:center;justify-content:space-between}
.top{cursor:grab;touch-action:none}
.np{display:flex;flex-direction:column;height:100%;padding:16px 22px 22px;background:linear-gradient(180deg,var(--np1),var(--ink) 70%)}
.np-top{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:600}
.np-art{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;margin:26px 0 22px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.np-meta{display:flex;align-items:center;gap:10px}
.np-meta .t{font-size:22px;font-weight:700}
.np-meta .a{font-size:15px;color:var(--mute)}
.np .bar{margin-top:18px}
.np .ctrls{gap:26px;margin-top:14px}
.np .cb{width:56px;height:56px;background:none}
.np .cb:hover{background:none;opacity:.8}
.np .cb svg{width:34px;height:34px;fill:var(--txt)}
.np .cb{flex:none}
.np .cb.play{width:70px;height:70px;border-radius:50%;flex:none;background:var(--txt);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.np .cb.play:hover{background:#fff;opacity:1;transform:scale(1.03)}
.np .cb.play svg{width:30px;height:30px;fill:var(--ink)}
.np-ctrls .npicon svg{width:26px;height:26px}
.np-ctrls .npicon:hover{background:none;opacity:.8}
.np-bottom{margin-top:auto;display:flex;align-items:center;gap:6px}
.npicon{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:20px;color:var(--txt)}
.npicon svg{width:24px;height:24px}
.npicon:hover{background:var(--row-hi)}
.liked{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;flex:none;margin-left:auto}
.liked svg{width:16px;height:16px}
.np-meta .meta{flex:1;min-width:0}
.np .np-meta .t{font-size:22px;font-weight:700;color:var(--txt)}
.np .np-meta .a{font-size:15px}
.np .np-ctrls{justify-content:space-between;gap:0}
.np-hint{margin:10px 0 0;text-align:center;color:var(--warn);font-size:13px;font-weight:600;min-height:18px}
.toast.np-toast{top:60px;bottom:auto}
.qbtn svg{width:20px;height:20px}
.qbtn{display:flex;align-items:center;gap:8px;background:var(--row-hi);border:0;border-radius:999px;padding:10px 16px;font:700 14px var(--f-ui);cursor:pointer}
.qbtn .dot{background:var(--warn);color:#241a00;border-radius:999px;padding:1px 8px;font-size:12px}
.toprow{display:flex;align-items:center;gap:8px;margin-top:10px}
.circ{width:34px;height:34px;border-radius:50%;border:0;background:var(--row-hi);font-size:16px;cursor:pointer;display:grid;place-items:center}
.pillbtn.end{color:var(--txt)}
.cb.sm{width:38px;height:38px}.cb.sm svg{width:20px;height:20px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.actbtn{background:#2a2a2a;border:0;border-radius:12px;padding:12px 0 10px;font:500 13px var(--f-ui);cursor:pointer;display:grid;justify-items:center;gap:6px;color:var(--txt)}
.actbtn:hover{background:#333}
.actbtn svg{width:22px;height:22px}
.circ svg{width:18px;height:18px}
.ctrls.slim{margin-top:0;gap:36px}
.qctrls{display:flex;justify-content:center;align-items:center;gap:34px;margin-bottom:10px}
.qctrls .cb{width:46px;height:46px;flex:none;background:none}
.qctrls .cb svg{width:28px;height:28px;fill:var(--txt)}
.qctrls .cb.play{width:52px;height:52px;border-radius:50%;background:var(--txt)}
.qctrls .cb.play svg{width:24px;height:24px;fill:var(--ink)}
.nowctrls{display:flex;align-items:center;gap:2px;flex:none}
.nc{width:34px;height:34px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.nc svg{width:18px;height:18px;fill:var(--txt)}
.nc:hover{background:var(--row-hi)}
.ncplay{background:var(--txt)}.ncplay svg{fill:var(--ink)}
.nowplay{width:34px;height:34px;border-radius:50%;background:var(--txt);color:var(--ink);display:grid;place-items:center;flex:none}
.nowplay svg{width:16px;height:16px;margin-left:2px}
.top h3{margin:0;font-size:20px;font-weight:700}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-ui);border:2px solid var(--panel);margin-left:-6px;color:#111}
.avM{background:#ff9ec7}.avJ{background:#8fd3ff}.avK{background:#b9f28a}
.qhead{display:flex;align-items:center;gap:8px;padding:12px 18px 6px}
.qhead b{font-size:17px;flex:1}
.pillbtn{background:var(--row-hi);border:0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
.list{flex:1;overflow-y:auto;position:relative;padding:0 10px 12px;scroll-behavior:smooth}
.sec{font-size:16px;color:var(--txt);padding:16px 8px 8px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.sec .hint{font-size:13px;font-weight:400;color:var(--mute)}
.song{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.song:hover{background:var(--row)}
.art{width:42px;height:42px;border-radius:6px;flex:none}
.meta{flex:1;min-width:0}
.meta .t{font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-ui);color:#111;flex:none}
.grip{color:var(--dim);font-size:18px;width:28px;height:34px;display:grid;place-items:center;flex:none}
.grip.draggable{cursor:grab;touch-action:none;color:var(--mute)}
.song.dragging{background:var(--row-hi);opacity:.9;position:relative;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.song.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.song.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
.song{-webkit-touch-callout:none;user-select:none}
.now{background:var(--row)}
.now .t{color:var(--accent)}
.now .t.marq{text-overflow:clip}
.now .t.marq span{display:inline-block;animation:marq var(--dur,8s) linear infinite;padding-right:40px}
@keyframes marq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--dist))}}
@media (prefers-reduced-motion: reduce){.now .t.marq span{animation:none}.now .t.marq{text-overflow:ellipsis}}
.hist .song{opacity:.6}
.hist .song:hover{opacity:.9}
.skipped .song{opacity:.55}
.skipped .song:hover{opacity:.85}
.more{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}
.more:hover{background:var(--row-hi);color:var(--txt)}
.skipwrap{border:1px dashed var(--line);border-radius:12px;margin:8px 0 2px;padding-bottom:4px}
.badge{position:absolute;top:150px;left:50%;transform:translateX(-50%);background:var(--warn);color:#241a00;border:0;border-radius:999px;padding:6px 14px;font:700 13px var(--f-ui);cursor:pointer;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.player{background:var(--panel);border-top:1px solid var(--line);padding:10px 18px 16px}
.pl-top{display:flex;align-items:center;gap:12px}
.pl-top .meta .t{font-size:14px}
.bar{height:3px;background:var(--line);border-radius:2px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--txt)}
.times{display:flex;justify-content:space-between;font:12px var(--f-mono);color:var(--mute)}
.ctrls{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:6px}
.cb{background:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.cb:hover{background:var(--row-hi)}
.cb svg{width:24px;height:24px;fill:var(--txt)}
.play{background:var(--txt)}.play:hover{background:#fff}
.play svg{fill:var(--ink)}
/* overlays */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px;z-index:20}
.dialog{background:var(--row);border-radius:16px;padding:20px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.dialog h4{margin:0 0 6px;font-size:19px}
.dialog p{margin:0 0 10px;color:var(--mute);font-size:14px;line-height:1.45}
.dialog ul{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:6px}
.dialog li{display:flex;align-items:center;gap:8px;font-size:14px}
.dbtns{display:flex;gap:10px}
.dbtns button{flex:1;border-radius:999px;padding:11px 0;font-weight:700;font-size:15px;cursor:pointer;border:1.5px solid var(--line);background:transparent}
.dbtns .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:absolute;left:12px;right:12px;bottom:168px;background:var(--txt);color:var(--ink);border-radius:8px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:400;font-size:14px;z-index:15;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.toast span{flex:1}
.toast button{background:none;border:0;color:#000;font:700 14px var(--f-ui);cursor:pointer;padding:4px 6px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--row);border-radius:18px 18px 0 0;padding:10px 10px 22px;z-index:25;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .opt{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 12px;font-size:16px;font-weight:600;border-radius:10px;cursor:pointer}
.sheet .opt:hover{background:var(--row-hi)}
.sheet .ours{background:var(--row-hi);border-radius:12px;margin:0 2px 8px;padding:2px 0}
.sheet .ours .opt{color:var(--accent)}
.sheet .std{font-weight:500;padding:11px 12px;font-size:15px}
.sheet{max-height:85%;overflow-y:auto}
.sheet .who-line{padding:4px 12px 10px;color:var(--mute);font-size:13px}

/* --- Spotify iOS Jam queue look (from Matt's screenshots) --- */
.top{background:var(--ink);border-bottom:1px solid var(--line);padding:8px 18px 14px}
.top h3{font-size:23px;font-weight:700;letter-spacing:-.015em}
.toprow{margin-top:12px}
.circ{width:38px;height:38px;background:var(--row-hi)}
.circ svg{width:20px;height:20px}
.av{width:36px;height:36px;font:600 17px var(--f-ui);border:2px solid var(--ink);margin-left:-8px;color:#1a1a1a}
.avM{background:#f573b5}.avJ{background:#7cc8ff}.avK{background:#a6e36f}
.pillbtn{background:var(--row-hi);padding:9px 17px;font-size:15px;font-weight:700}
.pillbtn.end{color:#f37c7c}
.qhead{padding:16px 18px 6px;align-items:flex-start}
.qhead .qt{flex:1;display:flex;flex-direction:column;gap:2px}
.qhead .qt b{font-size:18px;font-weight:700}
.qhead .qt span{font-size:15px;color:var(--mute)}.qhead .qt span em{font-style:normal;color:var(--txt)}
.list{padding:0 18px 12px}
.sec{font-size:15px;font-weight:400;color:var(--mute);padding:14px 0 6px;border-top:1px solid var(--line);margin-top:8px}
.sec .hint{font-size:13px;color:var(--dim)}
.song{gap:14px;padding:7px 0;border-radius:0}
.song:hover{background:none}
.art{width:52px;height:52px;border-radius:4px}
.meta .t{font-size:17px;font-weight:400}
.meta .a{font-size:14px;margin-top:3px;display:flex;align-items:center;gap:5px}
.qi{width:16px;height:16px;flex:none;color:var(--accent)}
.who{width:30px;height:30px;font:500 15px var(--f-ui);color:#1a1a1a}
.grip{width:30px;color:var(--txt);font-size:0}
.grip svg{width:22px;height:22px}
.now{background:none}
.now .t{color:var(--accent)}
.nowplay{width:38px;height:38px}
.skipwrap{border:0;border-radius:0;margin:0;padding:0}
.skipwrap .sec{border-top:0;margin-top:0}
.skipped .song{opacity:.55}
.skipped .song.issk{opacity:.8}
.sktag{background:var(--warn);color:#241a00;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px;flex:none}
.player{background:var(--ink);border-top:0;padding:8px 18px 16px}
.actions{gap:8px}
.actbtn{background:var(--row-hi);border-radius:14px;padding:14px 0 12px;font:500 14px var(--f-ui);gap:8px}
.actbtn svg{width:24px;height:24px}
.np{background:linear-gradient(180deg,#5a3b2a,#121212 75%)}
.np-meta .t,.np .np-meta .t{font-size:26px;font-weight:700;letter-spacing:-.01em}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:24px}
  .phone{justify-self:center;order:-1}
  .notes{padding-top:0}
}
@media (max-width:440px){
  body{padding-block:0}
  .phone{justify-self:stretch;border:0;border-radius:0;max-width:none;height:100vh;height:100dvh;max-height:none;min-height:0;box-shadow:none;margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));width:auto}
  .notes{padding-bottom:24px}
}
@media (prefers-reduced-motion: reduce){.list{scroll-behavior:auto}}
</style>

<div class="wrap">
  <div class="phone" aria-label="Music queue prototype">
    <div class="app" id="app"></div>
  </div>

  <section class="notes">
    <h1>Spotify Jam queue prototype</h1>
    <p>You're in a Jam with J and K. Use it like a phone. Nothing actually plays.</p>
    <ol>
      <li>Tap <b>Drip</b>, then <b>Cancel</b>.</li>
      <li>Tap <b>Drip</b> again, choose <b>Skip</b>, then <b>Undo</b>.</li>
      <li>Skip again and find the skipped songs (tap the yellow button).</li>
      <li>Get a song back with <b>⋯</b>, or press <b>⏮</b>.</li>
    </ol>
    <button class="restart" id="restart" type="button">Restart</button>
  </section>
</div>

<script>
const ART=[["#ff7a59","#7b2ff7"],["#2bd2ff","#2b4dff"],["#ffd23f","#ee4266"],["#3bceac","#0e7c7b"],["#c86bfa","#ff9a8b"],["#f9c80e","#f86624"],["#9bf6ff","#4361ee"],["#a7c957","#386641"]];
const WHO={M:"#ff9ec7",J:"#8fd3ff",K:"#b9f28a"};
const START=()=>({
  now:{t:"September",a:"Earth, Wind & Fire",w:"M",c:0},
  queue:[
    {t:"Fate",a:"ENHYPEN",w:"J",c:1},
    {t:"BAD",a:"ATEEZ",w:"J",c:2},
    {t:"EYES CLOSED",a:"JISOO, ZAYN",w:"K",c:3},
    {t:"Hooligan",a:"BTS",w:"M",c:4},
    {t:"Drip",a:"ATEEZ",w:"K",c:5}
  ],
  skipped:[{t:"Dynamite",a:"BTS",w:"K",c:4},{t:"Super Shy",a:"NewJeans",w:"J",c:1},{t:"Dancing Queen",a:"ABBA",w:"M",c:6}],
  rec:[{t:"Every Breath You Take",a:"The Police",c:6},{t:"Take on Me",a:"a-ha",c:7},{t:"Don't Stop Me Now",a:"Queen",c:0}],
  history:[]
});
const skN=()=>S.skipped.filter(x=>x.sk).length;
const clean=x=>{const {sk,...r}=x; return r;};
let view="queue", suppressClick=false, S=START(), modal=null, toast=null, toastTimer=null, sheet=null, undoSnap=null, revealSkipped=false;
const app=document.getElementById('app');
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const art=c=>`<div class="art" style="background:linear-gradient(135deg,${ART[c%8][0]},${ART[c%8][1]})"></div>`;
const who=w=>w?`<span class="who" style="background:${WHO[w]}">${w}</span>`:"";

    <div class="ours">
      <button class="opt" type="button" data-act="addBack">＋ Add back to queue</button>
      <button class="opt" type="button" data-act="sheetPlay">▶ Play now</button>

function showToast(msg,undo){ toast={msg,undo}; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toast=null; render(true);},6000); }
function snap(){ undoSnap=clone(S); }
// Tap a History song: play it now. Skipped songs after it return to the queue in order;
// songs that already played stay in History. The song you leave goes back to the top of the queue.
function playHistory(k){
  snap(); const H=S.skipped, s=clean(H[k]), after=H.slice(k+1);
  const back=after.filter(x=>x.sk).map(clean);
  S.queue=[...back,...(S.now.w?[S.now]:[]),...S.queue]; if(!S.now.w) S.rec.unshift(S.now);
  S.skipped=[...H.slice(0,k),...after.filter(x=>!x.sk)]; S.now=s;
  showToast(back.length?`Playing "${esc(s.t)}". ${back.length} skipped song${back.length>1?"s":""} back in the queue`:`Playing "${esc(s.t)}"`,true); render(false);
}
function doSkip(i){
  snap();
  const A=[...S.queue,...S.rec], Q=S.queue.length;
  if(i===0){ S.skipped.push(clean(S.now)); S.now=A[0]; if(Q) S.queue.shift(); else S.rec.shift(); toast=null; render(false); return; }
  const skippedNow=[S.now,...A.slice(0,i)];
  S.skipped.push(...skippedNow.filter((x,k)=>k===0||x.w).map(x=>({...clean(x),sk:true})));  // skipped autoplay songs are not saved; Undo still restores them
  S.now=A[i];
  if(i<Q){ S.queue=S.queue.slice(i+1); } else { S.rec=S.rec.slice(i-Q+1); S.queue=[]; }
  revealSkipped=false;
  if(skippedNow.length) showToast(`${skippedNow.length} song${skippedNow.length>1?"s":""} skipped`,true); else toast=null;
  render(false);
}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, i=+el.dataset.i;
  if(act==="more"){ e.stopPropagation(); sheet={kind:"skipped",i}; render(true); return; }
  if(act==="moreHist"){ e.stopPropagation(); sheet={kind:"hist",i}; render(true); return; }
  if(suppressClick){ suppressClick=false; return; }
  switch(act){
    case "tap": if(i>=1){ modal={type:"skip",i}; render(true);} else doSkip(i); break;
    case "cancel": modal=null; render(true); break;
    case "toNow": view="now"; sheet=null; render(); break;
    case "toQueue": view="queue"; render(false); break;
    case "confirmSkip": { const k=modal.i; modal=null; doSkip(k); break; }
    case "undo": if(undoSnap){ S=undoSnap; undoSnap=null; toast=null; clearTimeout(toastTimer); revealSkipped=false; showToast("Queue restored",false); render(false);} break;
    case "reveal": { revealSkipped=true; render(true); const L=app.querySelector('.list'), sk=app.querySelector('.issk')||app.querySelector('#skipsec'); L.scrollTo({top:sk?sk.offsetTop-40:0}); break; }
    case "playSkipped": playHistory(i); break;
    case "addBack": { snap(); const s=clean(S.skipped.splice(sheet.i,1)[0]); S.queue.unshift(s); sheet=null; showToast(`Added "${esc(s.t)}" back as next`,true); render(true); break; }
    case "sheetPlay": { const k=sheet.i; sheet=null; playHistory(k); break; }
    case "closeSheet": sheet=null; render(true); break;
    case "playHist": { snap(); const h=S.history.splice(i,1)[0]; S.queue.unshift(S.now); S.now=h; showToast(`Playing "${esc(h.t)}" again`,true); render(false); break; }
    case "histAdd": { snap(); const h=S.history[sheet.i]; S.queue.push({...h}); sheet=null; showToast(`Added "${esc(h.t)}" to the queue`,true); render(true); break; }
    case "histPlay": { const k=sheet.i; sheet=null; snap(); const h=S.history.splice(k,1)[0]; S.queue.unshift(S.now); S.now=h; showToast(`Playing "${esc(h.t)}" again`,true); render(false); break; }
    case "removeQ": { snap(); const s=S.queue.splice(sheet.i,1)[0]; sheet=null; showToast(`Removed "${esc(s.t)}"`,true); render(true); break; }
    case "addRec": { snap(); const s={...S.rec[sheet.i],w:"M"}; S.queue.push(s); sheet=null; showToast(`Added "${esc(s.t)}" to the queue`,true); render(true); break; }
    case "std": sheet=null; showToast("Not part of this prototype",false); render(true); break;
    case "playOutside": { const k=S.queue.length+i; if(k>=1){ modal={type:"skip",i:k}; render(true);} else doSkip(0); break; }
    case "outsideKeep": { const r=S.rec.splice(modal.i,1)[0]; modal=null; S.history.push(S.now); S.now=r; showToast(`Playing "${esc(r.t)}". Your queue is kept`,false); render(true); break; }
    case "outsideClear": { snap(); const r=S.rec.splice(modal.i,1)[0]; const n=S.queue.length; modal=null; S.history.push(S.now); S.now=r; S.queue=[]; showToast(`Playing "${esc(r.t)}". Cleared ${n} songs`,true); render(true); break; }
    case "prev":
      if(S.skipped.length){ snap(); if(S.now.w) S.queue.unshift(S.now); else S.rec.unshift(S.now); const back=S.skipped.pop(); S.now=clean(back); if(back.sk) showToast(`Brought back "${esc(S.now.t)}"`,true); else toast=null; render(false); }
      break;
    case "next": if(S.queue.length){ S.skipped.push(clean(S.now)); S.now=S.queue.shift(); render(false);} else if(S.rec.length){ S.skipped.push(clean(S.now)); S.now=S.rec.shift(); showToast(`Playing a recommended song: "${esc(S.now.t)}"`,false); render(false);} else { showToast("Nothing left to play",false); render(true);} break;
    case "noop": break;
    case "clear": if(S.queue.length){ modal={type:"clear"}; render(true);} break;
    case "confirmClear": snap(); const n=S.queue.length; S.queue=[]; modal=null; showToast(`Cleared ${n} songs`,true); render(true); break;
  }
});

let sd=null;

  if(view!=="queue") return;
  const top=e.target.closest('.top'); if(!top || (e.target.closest('button') && !e.target.closest('.grabbar'))) return;
  sd={y:e.clientY,dy:0,moved:false,grab:!!e.target.closest('.grabbar')};
});
window.addEventListener('pointermove',e=>{
  if(!sd) return; sd.dy=Math.max(0,e.clientY-sd.y); if(sd.dy>4) sd.moved=true;
  app.style.transition='none'; app.style.transform=`translateY(${sd.dy}px)`;
});
const endSheet=()=>{
  if(!sd) return; const {dy,moved,grab}=sd; sd=null;
  app.style.transition='transform .22s ease';
  if(dy>110){ app.style.transform='translateY(100%)'; setTimeout(()=>{ app.style.transition='none'; app.style.transform=''; view="now"; sheet=null; render(); },200); }
  else { app.style.transform=''; if(!moved && grab){ suppressClick=true; setTimeout(()=>suppressClick=false,50); view="now"; sheet=null; render(); return; } }
  if(moved){ suppressClick=true; setTimeout(()=>suppressClick=false,50); }
};
window.addEventListener('pointerup',endSheet); window.addEventListener('pointercancel',endSheet);
// drag to reorder (queue only)
let drag=null;
app.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip.draggable');
  if(g){ e.preventDefault(); const rowEl=g.closest('.song'); drag={from:+g.dataset.drag,rowEl,startY:e.clientY,to:+g.dataset.drag}; rowEl.classList.add('dragging'); g.setPointerCapture(e.pointerId); return; }
  const r=e.target.closest('.song[data-kind]');
  if(r && !e.target.closest('.more')){
    const kind=r.dataset.kind, i=+r.dataset.i;
    lp={t:setTimeout(()=>{ suppressClick=true; sheet={kind,i}; render(true); },500),x:e.clientX,y:e.clientY};
  }
});
let lp=null;
app.addEventListener('pointermove',e=>{
  if(lp && (Math.abs(e.clientX-lp.x)>8||Math.abs(e.clientY-lp.y)>8)){ clearTimeout(lp.t); lp=null; }
  if(!drag) return;
  drag.rowEl.style.transform=`translateY(${e.clientY-drag.startY}px)`;
  const rows=[...app.querySelectorAll('.song[data-kind=queue]')];
  rows.forEach(r=>r.classList.remove('drop-before','drop-after'));
  let to=drag.from;
  rows.forEach((r,k)=>{ if(r===drag.rowEl) return; const b=r.getBoundingClientRect(); if(e.clientY>b.top && e.clientY<b.bottom){ to=k; r.classList.add(k<drag.from?'drop-before':'drop-after'); } });
  drag.to=to;
});
const endDrag=()=>{ if(lp){clearTimeout(lp.t); lp=null;} if(!drag) return; const {from,to}=drag; drag=null; if(to!==from){ snap(); const [m]=S.queue.splice(from,1); S.queue.splice(to,0,m); } suppressClick=true; setTimeout(()=>suppressClick=false,50); render(true); };
app.addEventListener('pointerup',endDrag); app.addEventListener('pointercancel',endDrag);
app.addEventListener('contextmenu',e=>{ const r=e.target.closest('.song[data-kind]'); if(!r) return; e.preventDefault(); const kind=r.dataset.kind, i=+r.dataset.i; sheet={kind,i}; render(true); });
app.addEventListener('keydown',e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches('.song[role=button]')){ e.preventDefault(); e.target.click(); }});
document.getElementById('restart').addEventListener('click',()=>{ S=START(); view="queue"; modal=null; toast=null; sheet=null; undoSnap=null; revealSkipped=false; clearTimeout(toastTimer); render(false); });
render(false);
</script>
